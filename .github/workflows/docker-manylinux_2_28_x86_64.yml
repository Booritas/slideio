name: manylinux_2_28_x86_64 docker image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SLIDEIO_VERSION: 2.8.0

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Log in to Dockerhub Container Registry
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # The context is the repository root: the image's deps stage copies the
    # conanfiles and profiles out of it to populate its conan cache.
    - name: Build Docker image
      run: docker build -f docker/manylinux_2_28_x86_64/Dockerfile -t slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }} .
  
    - name: Tag Docker image
      run: docker tag slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }} booritas/slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }}
  
    - name: Push Docker image
      run: docker push booritas/slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }}
  
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Tag Docker image
      run: docker tag slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }} ghcr.io/booritas/slideio/slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }}

    - name: Push Docker image
      run: docker push ghcr.io/booritas/slideio/slideio-manylinux_2_28_x86_64:${{ env.SLIDEIO_VERSION }}
