name: manylinux_2_28_x86_64 docker image

# Builds the manylinux build environment and pushes it to Docker Hub and ghcr.
# The image is a toolchain plus a conan cache with every dependency already
# built; it contains no slideio sources. Run it by hand when the toolchain or
# the dependency set changes -- there is nothing here that needs to run per
# commit, and the build takes the better part of an hour.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 2.8.0"
        required: true
        default: "2.8.0"
      conan_config:
        description: "Configuration whose dependencies are cached in the image"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
          - all
      push_latest:
        description: "Also move the :latest tag to this build"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    # ghcr is pushed to with GITHUB_TOKEN rather than a personal token.
    permissions:
      contents: read
      packages: write
    # The deps stage compiles everything conan center has no binary for at the
    # pinned compiler. That took ~40 minutes locally; this is a ceiling, not an
    # estimate.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # No submodules: the image copies only conanfiles and profiles, and
        # .dockerignore excludes extern/ from the build context anyway.

      # opencv, dcmtk and icu are all built from source inside the image. A
      # stock runner does not have room for that next to its preinstalled
      # toolchains.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the tag list
        id: tags
        run: |
          hub=booritas/slideio-manylinux_2_28_x86_64
          # ghcr rejects uppercase image names, and the owner is spelled
          # "Booritas".
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ghcr=ghcr.io/${owner}/slideio/slideio-manylinux_2_28_x86_64
          {
            echo "list<<TAGS"
            echo "${hub}:${{ inputs.tag }}"
            echo "${ghcr}:${{ inputs.tag }}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then
              echo "${hub}:latest"
              echo "${ghcr}:latest"
            fi
            echo "TAGS"
            echo "primary=${hub}:${{ inputs.tag }}"
          } >> "$GITHUB_OUTPUT"

      # The context is the repository root: the image's deps stage copies the
      # conanfiles and profiles out of it to populate its conan cache.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/manylinux_2_28_x86_64/Dockerfile
          build-args: |
            SLIDEIO_CONFIG=${{ inputs.conan_config }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Without this, buildx publishes a manifest list whose extra
          # attestation entry shows up on Docker Hub as an unknown/unknown
          # platform.
          provenance: false

      # Pull the tag that was just pushed and check the image is what it claims:
      # a working toolchain, a populated cache, and no library sources.
      - name: Smoke-test the pushed image
        run: |
          docker run --rm ${{ steps.tags.outputs.primary }} bash -c '
            set -e
            echo "conan  : $(conan --version)"
            echo "cmake  : $(cmake --version | head -1)"
            echo "gcc    : $(gcc --version | head -1)"
            echo "python : $(python3 --version)"
            python3 -c "import distro; print(\"distro :\", distro.id(), distro.version())"
            ssh -V
            recipes=$(conan list "*" | grep -cE "^ +[a-z0-9_.-]+/[0-9a-z]" || true)
            echo "recipes in cache: $recipes"
            [ "$recipes" -gt 10 ] || { echo "conan cache looks empty"; exit 1; }
            [ -z "$(ls -A /slideio)" ] || { echo "slideio sources baked into the image"; exit 1; }
            echo "smoke test OK"
          '
