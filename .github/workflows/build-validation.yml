name: Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest

    env:
      SLIDEIO_HOME: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          # extern/jpegxrcodec supplies the JPEG XR codec; without it the
          # CMake configure step stops with a FATAL_ERROR.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install conan distro

      - name: Sync toolchain
        run: python sync-toolchain.py

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-ubuntu-${{ hashFiles('src/**/conanfile.py', 'conanfile.txt', 'conan/**') }}
          restore-keys: |
            conan-ubuntu-

      - name: Conan install
        run: python install.py -a conan -c release

      - name: CMake configure
        run: python install.py -a configure-only -c release

      - name: Build
        run: python install.py -a build-only -c release

  build-macos:
    name: macOS
    runs-on: macos-latest

    env:
      SLIDEIO_HOME: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          # extern/jpegxrcodec supplies the JPEG XR codec; without it the
          # CMake configure step stops with a FATAL_ERROR.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install conan distro

      - name: Sync toolchain
        run: python sync-toolchain.py

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-macos-${{ hashFiles('src/**/conanfile.py', 'conanfile.txt', 'conan/**') }}
          restore-keys: |
            conan-macos-

      - name: Conan install
        run: python install.py -a conan -c release

      - name: CMake configure
        run: python install.py -a configure-only -c release

      - name: Build
        run: python install.py -a build-only -c release

  tsan-linux:
    name: ThreadSanitizer (Linux)
    runs-on: ubuntu-latest

    # Mechanism-level suites only (FileReader.*, ContextPool.*): they need no
    # slide corpus. The per-driver byte-exactness tests need the corpus, which
    # CI does not carry, and CLAUDE.md requires CI to leave
    # SLIDEIO_SKIP_MISSING_IMAGES unset, so a corpus-less run of those would
    # fail here rather than skip. Design intent is that they instead run under
    # ThreadSanitizer on a machine with the corpus before each driver's opt-in
    # commit merges (software-docs/specs/2026-09-07-parallel-read-block-design.md,
    # §6); in practice that run has not happened for any converted driver on
    # this Windows-only development setup -- see software-docs/TECH_DEBT.md
    # §20.3.
    #
    # CXXFLAGS/CFLAGS/LDFLAGS are set at job level so they reach both the
    # compile and link steps of the CMake build below. Conan's own
    # dependencies (OpenCV, libtiff, etc.) are prebuilt binaries and are NOT
    # instrumented -- TSan will miss races inside them but still catches races
    # in slideio's own code, which is what these two suites exercise.
    #
    # Built with -c debug, deliberately, not -c release: CMakeLists.txt only
    # appends -s (strip symbols) to CMAKE_CXX_FLAGS_RELEASE/_C_FLAGS_RELEASE
    # when CMAKE_BUILD_TYPE is Release, and that same variable's default -O3
    # would silently win over the -O1 below (last -O flag on the command line
    # wins). Release would therefore both blind TSan's stack traces (stripped
    # symbols despite -g) and ignore the requested -O1. Debug has neither
    # problem. Do not "optimise" this job back to Release.
    env:
      SLIDEIO_HOME: ${{ github.workspace }}
      CXXFLAGS: -fsanitize=thread -g -O1
      CFLAGS: -fsanitize=thread -g -O1
      LDFLAGS: -fsanitize=thread

    steps:
      - uses: actions/checkout@v4
        with:
          # extern/jpegxrcodec supplies the JPEG XR codec; without it the
          # CMake configure step stops with a FATAL_ERROR.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install conan distro

      - name: Sync toolchain
        run: python sync-toolchain.py

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-tsan-ubuntu-${{ hashFiles('src/**/conanfile.py', 'conanfile.txt', 'conan/**') }}
          restore-keys: |
            conan-tsan-ubuntu-

      - name: Conan install
        run: python install.py -a conan -c debug

      - name: CMake configure
        run: python install.py -a configure-only -c debug

      - name: Build
        run: python install.py -a build-only -c debug

      - name: FileReader and ContextPool under ThreadSanitizer
        run: ./build/debug/bin/slideio_tests --gtest_filter="FileReader.*:ContextPool.*"

  build-windows:
    name: Windows
    runs-on: windows-2022

    env:
      SLIDEIO_HOME: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          # extern/jpegxrcodec supplies the JPEG XR codec; without it the
          # CMake configure step stops with a FATAL_ERROR.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install conan distro

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Sync toolchain
        run: python sync-toolchain.py

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-windows-${{ hashFiles('src/**/conanfile.py', 'conanfile.txt', 'conan/**') }}
          restore-keys: |
            conan-windows-

      - name: Conan install
        run: python install.py -a conan -c release

      - name: CMake configure
        run: python install.py -a configure-only -c release

      - name: Build
        run: python install.py -a build-only -c release

  build-manylinux:
    name: manylinux_2_28 (x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The image carries a conan cache but no slideio sources, and the four
          # dependencies that are not on conan center are submodules of this
          # working copy.
          submodules: true

      # The build runs inside the image rather than the image being the job's
      # `container:`. A container job has to host the runner's Node, and this
      # image exists precisely to be old -- glibc 2.28 is the point of it -- so
      # that arrangement adds a failure mode that has nothing to do with
      # slideio. `docker run -v` is also how docker/manylinux_2_28_x86_64/Dockerfile
      # documents its own use.
      #
      # The tag is pinned. `latest` on this repository is two years older than
      # the versioned tags, so tracking it would quietly build against the wrong
      # toolchain; the pin has to be moved by hand when the image is rebuilt.
      - name: Build in the manylinux image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/slideio" \
            -w /slideio \
            -e SLIDEIO_HOME=/slideio \
            booritas/slideio-manylinux_2_28_x86_64:2.10.0 \
            bash -c '
              set -euo pipefail
              python3 install.py -a conan -c release
              python3 install.py -a configure-only -c release
              python3 install.py -a build-only -c release
              # The suites that need no slide corpus, as elsewhere in this file.
              ./build/release/bin/slideio_tests --gtest_filter="FileReader.*:ContextPool.*"
            '
